<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Henry Dropshipping — Mercado Livre</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:20px;background:#f5f5f5;color:#222}
.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #0001}
button{border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer}
.primary{background:#3483fa;color:#fff}.danger{background:#eee}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:9px;font-size:15px}
label{font-weight:600}
#status{white-space:pre-wrap}
small{color:#666}
</style>
</head>
<body>
<h1>Henry Dropshipping</h1>
<p>Publicação e gerenciamento de anúncios do Mercado Livre.</p>

<div class="card">
  <h2>1. Conexão</h2>
  <button class="primary" onclick="location.href='/api/auth'">Conectar Mercado Livre</button>
  <button class="danger" onclick="checkMe()">Verificar conexão</button>
  <p id="status"></p>
</div>

<div class="card">
  <h2>2. Publicar produto</h2>
  <small>O Mercado Livre pode exigir atributos específicos conforme a categoria. Use primeiro um anúncio simples/teste.</small>
  <label>Título</label>
  <input id="title" value="Suporte Para Celular E Tablet De Mesa Dobrável Ajustável">
  <label>Categoria (ID MLB)</label>
  <input id="category" placeholder="Ex.: MLB...">
  <label>Preço (R$)</label>
  <input id="price" type="number" step="0.01" value="29.90">
  <label>Quantidade</label>
  <input id="qty" type="number" value="1">
  <label>Tipo de anúncio</label>
  <select id="listing"><option value="gold_special">gold_special</option><option value="free">free</option></select>
  <label>URL da imagem</label>
  <input id="image" placeholder="https://...jpg">
  <label>Descrição</label>
  <textarea id="desc" rows="6">Suporte dobrável e ajustável para celular e tablet. Compacto, prático e ideal para mesa.</textarea>
  <button class="primary" onclick="publish()">PUBLICAR NO MERCADO LIVRE</button>
  <p id="result"></p>
</div>

<script>
async function checkMe(){
  const r=await fetch('/api/me'); const d=await r.json();
  document.querySelector('#status').textContent=r.ok?('Conectado! Usuário: '+(d.nickname||d.first_name||d.id)):('Não conectado: '+JSON.stringify(d));
}
async function publish(){
  const body={
    title:document.querySelector('#title').value.trim(),
    category_id:document.querySelector('#category').value.trim(),
    price:Number(document.querySelector('#price').value),
    currency_id:'BRL',
    available_quantity:Number(document.querySelector('#qty').value),
    buying_mode:'buy_it_now',
    listing_type_id:document.querySelector('#listing').value,
    condition:'new',
    description:document.querySelector('#desc').value.trim(),
    pictures:document.querySelector('#image').value.trim()?[{source:document.querySelector('#image').value.trim()}]:[]
  };
  const out=document.querySelector('#result'); out.textContent='Publicando...';
  const r=await fetch('/api/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json(); out.textContent=r.ok?('Publicado: '+(d.permalink||d.id)):('Erro: '+JSON.stringify(d));
}
if(new URLSearchParams(location.search).get('connected')) checkMe();
</script>
</body>
</html>
