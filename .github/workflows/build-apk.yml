name: Build Henry Western APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot with Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --quit --path .

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/Henry-Western-Beta.apk

      - name: Verify APK exists
        run: test -s build/Henry-Western-Beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Henry-Western-Beta
          path: build/Henry-Western-Beta.apk
          if-no-files-found: error
